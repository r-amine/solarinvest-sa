<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>SolarInvest SA - Login</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        
        .form-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        
        .form-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            padding: 32px 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-card h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 6px;
            color: #0284c7;
        }
        
        .form-card .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            background: #f1f5f9;
            padding: 5px;
            border-radius: 14px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: #0284c7;
            color: white;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
        }
        
        .form-group {
            margin-bottom: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-group input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: white;
        }
        
        .form-group input.error {
            border-color: #ef4444;
            background: #fef2f2;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 13px 48px 13px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .password-wrapper input:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
            background: white;
        }
        
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 16px;
            padding: 4px;
        }
        
        .password-toggle:hover {
            color: #0284c7;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 11px;
            margin-top: 5px;
            display: block;
        }
        
        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .info-box {
            background: #f0f9ff;
            padding: 16px;
            border-radius: 16px;
            margin-top: 20px;
            font-size: 12px;
            text-align: center;
            border: 1px solid #bae6fd;
            color: #0f172a;
            line-height: 1.5;
        }
        
        .why-us-link {
            text-align: center;
            margin-top: 16px;
        }
        
        .why-us-link a {
            color: #0284c7;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .why-us-link a:hover {
            background: #f0f9ff;
            transform: scale(1.02);
        }
        
        /* Toast */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            left: 16px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        
        .toast {
            background: white;
            border-radius: 14px;
            padding: 13px 16px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid;
            pointer-events: auto;
            font-size: 13px;
        }
        
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.info { border-left-color: #0284c7; }
        
        .toast i { font-size: 17px; }
        .toast.success i { color: #10b981; }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: #0284c7; }
        
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; color: #0f172a; margin-bottom: 2px; }
        .toast-message { font-size: 12px; color: #64748b; }
        .toast-close {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: #94a3b8;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Mobile */
        @media (max-width: 480px) {
            .form-card { padding: 24px 18px; }
            .form-card h1 { font-size: 22px; }
        }
        
        @media (min-width: 481px) {
            .toast-container {
                left: auto;
                right: 20px;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyh0B1oBOwPNIZoxB1fxAsfdob4Ovtnmqo_bID86gSs4pJy2pMnxdw-C0byxyv0XijTQ/exec";
        const ALLOWED_DOMAINS = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com'];
        
        let activeTab = 'login';
        let isSubmitting = false;
        
        function validateEmail(email) {
            if (!email) return false;
            const parts = email.split('@');
            if (parts.length !== 2) return false;
            const domain = parts[1].toLowerCase();
            return ALLOWED_DOMAINS.includes(domain);
        }
        
        function showToast(message, type = "info", title = "") {
            const container = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                div.className = 'toast-container';
                document.body.appendChild(div);
                return div;
            })();
            
            const titles = { success: "Success", error: "Error", info: "Information" };
            const icons = { success: "fa-check-circle", error: "fa-exclamation-circle", info: "fa-info-circle" };
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type]}"></i>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            
            container.appendChild(toast);
            setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
        }
        
        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...data })
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function handleLogin(email, password) {
            const result = await callAPI('login', { email, password });
            
            if (result.success) {
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userPassword', password);
                localStorage.setItem('userBalance', result.balance || 0);
                localStorage.setItem('userPanels', result.panels || 0);
                localStorage.setItem('userDailyProfit', result.dailyProfit || 0);
                localStorage.setItem('userTotalInvested', result.totalInvested || 0);
                showToast("Login successful! Redirecting...", "success");
                setTimeout(() => { window.location.href = "index.html"; }, 600);
                return true;
            } else {
                showToast(result.error || "Invalid email or password", "error");
                return false;
            }
        }
        
        async function handleRegister(email, password, retype) {
            if (!validateEmail(email)) {
                showToast("Please use a valid email (gmail, yahoo, outlook, hotmail)", "error");
                return false;
            }
            if (password !== retype) {
                showToast("Passwords do not match", "error");
                return false;
            }
            if (password.length < 6) {
                showToast("Password must be at least 6 characters", "error");
                return false;
            }
            
            const result = await callAPI('register', { email, password });
            
            if (result.success) {
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userPassword', password);
                showToast("Registration successful! Redirecting...", "success");
                setTimeout(() => { window.location.href = "index.html"; }, 800);
                return true;
            } else {
                showToast(result.error || "Registration failed", "error");
                return false;
            }
        }
        
        function switchTab(tab) {
            if (activeTab === tab) return;
            activeTab = tab;
            renderForm();
        }
        
        function togglePassword(inputId, toggleEl) {
            const input = document.getElementById(inputId);
            const icon = toggleEl.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        async function submitForm() {
            if (isSubmitting) return;
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email || !password) {
                showToast("Please fill all fields", "error");
                return;
            }
            
            if (!validateEmail(email)) {
                showToast("Please use a valid email (gmail, yahoo, outlook, hotmail)", "error");
                document.getElementById('email').classList.add('error');
                return;
            }
            
            isSubmitting = true;
            const btn = document.getElementById('action-btn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Processing...';
            
            let success = false;
            if (activeTab === 'login') {
                success = await handleLogin(email, password);
            } else {
                const retype = document.getElementById('retype').value;
                if (!retype) {
                    showToast("Please retype your password", "error");
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    isSubmitting = false;
                    return;
                }
                success = await handleRegister(email, password, retype);
            }
            
            if (!success) {
                btn.disabled = false;
                btn.innerHTML = originalText;
                isSubmitting = false;
            }
        }
        
        function renderForm() {
            const app = document.getElementById('app');
            const isLogin = activeTab === 'login';
            
            app.innerHTML = `
                <div class="form-container">
                    <div class="form-card">
                        <h1><i class="fas fa-solar-panel"></i> SolarInvest SA</h1>
                        <div class="subtitle">Invest in Solar Energy • Earn Daily Profits</div>
                        
                        <div class="tab-buttons">
                            <button class="tab-btn ${isLogin ? 'active' : ''}" onclick="switchTab('login')">Login</button>
                            <button class="tab-btn ${!isLogin ? 'active' : ''}" onclick="switchTab('register')">Register</button>
                        </div>
                        
                        <div class="form-group">
                            <input type="email" id="email" placeholder="Email (example@gmail.com)" autocomplete="email">
                        </div>
                        
                        <div class="form-group password-wrapper">
                            <input type="password" id="password" placeholder="Password" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
                            <span class="password-toggle" onclick="togglePassword('password', this)">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                        
                        ${!isLogin ? `
                            <div class="form-group password-wrapper">
                                <input type="password" id="retype" placeholder="Retype Password" autocomplete="new-password">
                                <span class="password-toggle" onclick="togglePassword('retype', this)">
                                    <i class="fas fa-eye"></i>
                                </span>
                            </div>
                        ` : ''}
                        
                        <button class="btn-primary" id="action-btn" onclick="submitForm()">
                            ${isLogin ? 'Login' : 'Create Account'}
                        </button>
                        
                        <div class="info-box">
                            <i class="fas fa-solar-panel"></i> 1 Solar Panel (550W) = 90 USDT<br>
                            Daily profit: 4 USDT • Total in 30 days: 120 USDT (33% ROI)
                        </div>
                        
                        <div class="why-us-link">
                            <a href="why-us.html">
                                <i class="fas fa-circle-info"></i> Why Us? Learn about the project
                            </a>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('email').addEventListener('input', (e) => {
                e.target.classList.remove('error');
            });
            
            ['email', 'password', 'retype'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') submitForm();
                    });
                }
            });
        }
        
        if (localStorage.getItem('userEmail')) {
            window.location.href = "index.html";
        } else {
            renderForm();
        }
    </script>
</body>
</html>
