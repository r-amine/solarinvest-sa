<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SolarInvest SA - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 16px 24px;
            border-radius: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #0284c7;
            cursor: pointer;
        }
        
        .logo i {
            margin-right: 10px;
            color: #fbbf24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .value.green { color: #10b981; }
        .value.blue { color: #0284c7; }
        .value.purple { color: #8b5cf6; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }
        
        .profile-section {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .profile-email {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #64748b;
        }
        
        .edit-profile-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            color: #0284c7;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .edit-profile-btn:hover {
            background: #e2e8f0;
        }
        
        .chart-container {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .chart-container h3 {
            margin-bottom: 15px;

            display: flex;

        }

        .leaderboard {

            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;

        }
        
        .leaderboard h3 {
            font-size: 18px;

            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .leaderboard-list {

        }
        
        .leaderboard-item {

            align-items: center;

        .leaderboard-rank {

        .leaderboard-info {

        }
        
        .leaderboard-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .leaderboard-panels {

        }
        
        .leaderboard-profit {
            font-weight: 700;
            color: #10b981;
            font-size: 14px;
        }
        
        .activity-feed {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        
        .activity-feed h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .activity-list {
            list-style: none;
            max-height: 400px;

        }
        
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .activity-icon {

            height: 36px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-email {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }
        
        .activity-amount {

            color: #10b981;

        .activity-detail {

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;

        }
        
        .panel-card:hover {

        }
        
        .panel-card.gold {
            border: 2px solid #fbbf24;
            background: linear-gradient(135deg, white, #fffbeb);
        }
        
        .panel-card.gold::before {
            content: "BEST VALUE";
            position: absolute;
            top: 12px;
            right: -30px;
            background: #fbbf24;
            color: #1e1b4b;

        .panel-price {

            color: #0284c7;
        }
        
        .panel-daily {
            color: #10b981;
            font-weight: 600;
            margin: 12px 0;

        }
        
        .panel-total {

            font-size: 14px;
        }
        
        .btn-outline {

            padding: 12px;
            background: #f0f9ff;
            border: 1px solid #0284c7;
            border-radius: 14px;
            font-weight: 600;
            color: #0284c7;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }
        
        .btn-outline:hover {
            background: #0284c7;
            color: white;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {

        }
        
        .wallet-box {
            background: white;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);

        .wallet-address {
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #e2e8f0;
        }
        
        .investment-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #10b981;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .claim-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.3);
        }
        
        .info-box {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #bae6fd;
        }
        
        .project-description {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 30px;
            border-radius: 28px;
            margin: 30px 0 20px;
            text-align: center;
        }
        
        .project-description h3 {
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .project-description p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .project-description .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .project-description .stat-item {
            text-align: center;
        }
        
        .project-description .stat-number {
            font-size: 28px;
            font-weight: 700;
        }
        
        .project-description .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .countdown-timer {
            background: #fef3c7;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
        }
        
        .countdown-timer .timer {
            font-size: 28px;
            font-weight: 700;
            color: #d97706;
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .countdown-timer .label {
            font-size: 13px;
            color: #92400e;
            margin-top: 5px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            animation: fadeInModal 0.2s ease;
        }
        
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            padding: 24px 24px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            font-size: 24px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            width: auto;
            padding: 0;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #ef4444;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-footer {
            padding: 0 24px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .modal-info {
            background: #f0f9ff;
            padding: 16px;
            border-radius: 16px;
            margin: 16px 0;
            text-align: center;
        }
        
        .modal-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .modal-info-row:last-child {
            border-bottom: none;
        }
        
        .modal-info-label {
            font-weight: 600;
            color: #64748b;
        }
        
        .modal-info-value {
            font-weight: 700;
            color: #0284c7;
        }
        
        .input-group {
            margin-bottom: 16px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #0f172a;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 14px;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #0284c7;
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-cancel:hover {
            background: #e2e8f0;
        }
        
        .btn-confirm {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2,132,199,0.3);
        }
        
        .error-text {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .toast {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 320px;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid;
        }
        
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.info { border-left-color: #0284c7; }
        
        .toast i { font-size: 20px; }
        .toast.success i { color: #10b981; }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: #0284c7; }
        
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .toast-message { font-size: 13px; color: #64748b; }
        .toast-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            width: auto;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .flex-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .panel-grid { grid-template-columns: 1fr; }
            .project-description { padding: 20px; }
            .project-description .stats { gap: 20px; }
            .toast { min-width: 280px; right: 16px; left: 16px; }
            .modal { width: 95%; margin: 16px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyh0B1oBOwPNIZoxB1fxAsfdob4Ovtnmqo_bID86gSs4pJy2pMnxdw-C0byxyv0XijTQ/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";
        const PANEL_PRICE = 90;
        const DAILY_PROFIT_PER_PANEL = 4;
        const TOTAL_PROFIT_30_DAYS = 120;
        const ROI_PERCENT = 33.33;
        
        let userEmail = null;
        let userBalance = 0;
        let userPanels = 0;
        let userDailyProfit = 0;
        let userTotalInvested = 0;
        let activeInvestment = null;
        let isLoading = false;
        let countdownInterval = null;
        let profitChart = null;
        
        // Realistic investor names
        const investorNames = [
            "SolarWhale", "GreenGiant", "SunKing", "EcoRich", "PowerInvestor",
            "FutureFund", "CleanCapital", "SolarTycoon", "EnergyElite", "GreenWealth",
            "SunHunter", "EcoProsper", "SolarDream", "PowerProfit", "GreenGains"
        ];
        
        // Generate realistic leaderboard based on panel count and profit
        function generateRealisticLeaderboard() {
            const leaderboard = [];
            for (let i = 0; i < 10; i++) {
                // Random panels between 1 and 100
                const panels = Math.floor(Math.random() * 100) + 1;
                // Calculate realistic profit: panels * 120 USDT (total for 30 days) + some random
                const profit = panels * TOTAL_PROFIT_30_DAYS + Math.floor(Math.random() * 500);
                const invested = panels * PANEL_PRICE;
                const roi = ((profit - invested) / invested * 100).toFixed(1);
                
                leaderboard.push({
                    name: investorNames[Math.floor(Math.random() * investorNames.length)] + (Math.floor(Math.random() * 100) + 1),
                    panels: panels,
                    invested: invested,
                    profit: profit,
                    roi: roi
                });
            }
            // Sort by profit (highest first)
            leaderboard.sort((a, b) => b.profit - a.profit);
            return leaderboard;
        }
        
        let leaderboardData = generateRealisticLeaderboard();
        
        // Refresh leaderboard every 30 seconds
        setInterval(() => {
            leaderboardData = generateRealisticLeaderboard();
            updateLeaderboardDisplay();
        }, 30000);
        
        function updateLeaderboardDisplay() {
            const leaderboardList = document.getElementById('leaderboard-list');
            if (!leaderboardList) return;
            
            let html = '';
            leaderboardData.forEach((item, index) => {
                let rankClass = '';
                if (index === 0) rankClass = 'rank-1';
                else if (index === 1) rankClass = 'rank-2';
                else if (index === 2) rankClass = 'rank-3';
                
                html += `
                    <li class="leaderboard-item">
                        <div class="leaderboard-rank ${rankClass}">${index + 1}</div>
                        <div class="leaderboard-info">
                            <div class="leaderboard-name">${item.name}</div>
                            <div class="leaderboard-panels"><i class="fas fa-solar-panel"></i> ${item.panels} panels (${item.invested} USDT)</div>
                        </div>
                        <div class="leaderboard-profit">+${item.profit.toFixed(0)} USDT</div>
                    </li>
                `;
            });
            leaderboardList.innerHTML = html;
        }
        
        // Generate realistic activity feed based on actual profit amounts
        const activityNames = [
            "SolarGuru", "EcoInvestor", "SunChaser", "GreenTrader", "PowerMaker",
            "CleanEnergy", "FutureSolar", "WealthSun", "ProfitPanel", "SolarStar"
        ];
        
        let activityList = [];
        let activityInterval = null;
        
        function generateRealisticActivity() {
            const newActivities = [];
            // Possible profit amounts (multiples of 4 USDT - daily profit per panel)
            const profitAmounts = [4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60];
            // Possible investment amounts (multiples of 90 USDT)
            const investAmounts = [90, 180, 270, 360, 450, 540, 630, 720, 810, 900];
            const types = ['profit', 'investment', 'withdrawal'];
            
            for (let i = 0; i < 5; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                let amount, detail, icon;
                
                if (type === 'profit') {
                    amount = profitAmounts[Math.floor(Math.random() * profitAmounts.length)];
                    const panels = amount / 4;

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function startCountdownTimer(withdrawalDate) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateTimer() {
                const timerEl = document.getElementById('countdown-timer');
                if (!timerEl) return;
                
                const now = new Date();
                const end = new Date(withdrawalDate);
                const remaining = Math.max(0, end - now);
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.innerHTML = '<span class="timer" style="color: #10b981;">Available Now!</span><div class="label">You can now withdraw your profit</div>';
                    renderDashboard();
                    return;
                }
                
                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                
                if (days > 0) {
                    timerEl.innerHTML = `<span class="timer">${days}d ${hours}h ${minutes}m ${seconds}s</span><div class="label">Time remaining until withdrawal available</div>`;
                } else {
                    timerEl.innerHTML = `<span class="timer">${hours}h ${minutes}m ${seconds}s</span><div class="label">Time remaining until withdrawal available</div>`;
                }
            }
            
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

                lockEnd.setDate(lockEnd.getDate() + 3);
