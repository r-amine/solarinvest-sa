<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SolarInvest SA - 125% Profit Investment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .form-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .form-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .form-card h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .form-card .subtitle {
            text-align: center;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: #f59e0b;
            color: #1e1b4b;
        }
        
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        
        input::placeholder {
            color: #94a3b8;
        }
        
        button {
            padding: 14px;
            background: #f59e0b;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #1e1b4b;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #d97706;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
        }
        
        .value.green { color: #4ade80; }
        .value.yellow { color: #f59e0b; }
        .value.blue { color: #60a5fa; }
        
        .vip-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .vip-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .vip-card:hover {
            transform: translateY(-5px);
            border-color: #f59e0b;
        }
        
        .vip-card.gold {
            border: 2px solid #fbbf24;
            background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(0,0,0,0.3));
        }
        
        .vip-header {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            padding: 15px;
            text-align: center;
        }
        
        .vip-header.gold {
            background: linear-gradient(135deg, #fbbf24, #d97706);
        }
        
        .vip-name {
            font-size: 24px;
            font-weight: bold;
        }
        
        .vip-body {
            padding: 20px;
        }
        
        .vip-price {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .vip-return {
            text-align: center;
            color: #4ade80;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .vip-profit {
            text-align: center;
            color: #fbbf24;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .vip-delay {
            background: rgba(59,130,246,0.2);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            margin: 15px 0;
        }
        
        .buy-btn {
            width: 100%;
        }
        
        .gold-badge {
            background: #fbbf24;
            color: #1e1b4b;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }
        
        .investment-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #f59e0b;
        }
        
        .countdown {
            font-size: 24px;
            font-weight: bold;
            color: #f59e0b;
            text-align: center;
            margin: 15px 0;
        }
        
        .withdraw-btn {
            background: #4ade80;
            width: 100%;
            margin-top: 15px;
        }
        
        .withdraw-btn:hover {
            background: #22c55e;
        }
        
        .flex-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .deposit-btn {
            background: #3b82f6;
            color: white;
        }
        
        .deposit-btn:hover {
            background: #2563eb;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .logout-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .info-box {
            background: rgba(59,130,246,0.2);
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 14px;
            text-align: center;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-size: 18px;
        }
        
        .wallet-box {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .wallet-address {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 10px 0;
        }
        
        .error-text {
            color: #ef4444;
            margin-bottom: 15px;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .form-card {
                padding: 25px;
            }
            .vip-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ============================================================
        // CONFIGURATION - YOUR APPS SCRIPT URL
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwIbykWyLQ3zibWsKTuH2YqqE0g8IMN8sWzh3g3pyzaeq3g9yd5VP3CnVYFqJTcY7VDcg/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";
        
        let userData = null;
        let userBalance = 0;
        let userInvested = 0;
        let userEarned = 0;
        let withdrawalStatus = null;
        let isLoading = false;
        let countdownInterval = null;
        
        async function callSheet(action, data = {}) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...data })
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                console.error("API Error:", error);
                return { error: error.message };
            }
        }
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function register(email, password, retypePassword) {
            if (password !== retypePassword) return { success: false, error: 'Passwords do not match' };
            if (password.length < 6) return { success: false, error: 'Password must be at least 6 characters' };
            
            const checkUser = await callSheet('getUser', { email });
            if (checkUser && checkUser.email) return { success: false, error: 'Email already registered' };
            
            const hashedPassword = await hashPassword(password);
            const result = await callSheet('register', { email, password: hashedPassword });
            
            if (result.success) {
                localStorage.setItem('token', btoa(email));
                localStorage.setItem('email', email);
                return { success: true };
            }
            return { success: false, error: result.error };
        }
        
        async function login(email, password) {
            const hashedPassword = await hashPassword(password);
            const result = await callSheet('getUser', { email });
            
            if (result.error || !result.email) return { success: false, error: 'User not found' };
            if (result.password_hash !== hashedPassword) return { success: false, error: 'Invalid password' };
            
            localStorage.setItem('token', btoa(email));
            localStorage.setItem('email', email);
            return { success: true };
        }
        
        async function fetchUser() {
            const email = localStorage.getItem('email');
            if (!email) return false;
            
            const result = await callSheet('getUser', { email });
            if (result.email) {
                userData = result;
                userBalance = result.balance || 0;
                userInvested = result.totalInvested || 0;
                userEarned = result.totalEarned || 0;
                return true;
            }
            return false;
        }
        
        async function fetchWithdrawalStatus() {
            const email = localStorage.getItem('email');
            if (!email) return null;
            
            const result = await callSheet('checkWithdrawalStatus', { email });
            withdrawalStatus = result;
            return withdrawalStatus;
        }
        
        async function depositWithTX() {
            const txHash = prompt(
                "📋 DEPOSIT USDT\n\n" +
                "1. Send USDT (TRC20) to:\n" + MAIN_WALLET + "\n\n" +
                "2. Enter your Transaction ID (TX Hash):\n\n" +
                "Example: 0x7e6d5c9f3a8b2e1d4c7f9a3b5e8d2c1a\n\n" +
                "Enter TX Hash:"
            );
            
            if (!txHash) return;
            
            if (txHash.length < 20) {
                alert("Invalid Transaction ID. Please copy the full TX Hash.");
                return;
            }
            
            const amount = prompt("Enter the amount you sent (USDT):", "");
            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) {
                alert("Please enter a valid amount.");
                return;
            }
            
            isLoading = true;
            showLoading("Verifying transaction on blockchain...");
            
            const result = await callSheet('verifyTransaction', { 
                email: localStorage.getItem('email'),
                txHash: txHash,
                amount: parseFloat(amount)
            });
            
            hideLoading();
            
            if (result.success) {
                await fetchUser();
                alert(`✅ Verified! ${result.amount} USDT added to your balance.`);
                renderDashboard();
            } else {
                alert(`❌ Verification failed: ${result.error}`);
            }
            isLoading = false;
        }
        
        async function purchaseVIP(vipLevel, config) {
            if (userBalance < config.cost) {
                alert(`⚠️ Insufficient balance! Need ${config.cost} USDT.`);
                return;
            }
            
            if (!confirm(`Buy ${vipLevel} for ${config.cost} USDT?\n\n📈 Profit: +${config.profitPercent}%\n💰 Total Return: ${config.totalReturn} USDT\n⏰ Withdrawal available after ${config.lockDays} days\n\nProceed?`)) {
                return;
            }
            
            isLoading = true;
            showLoading("Processing your investment...");
            
            const result = await callSheet('purchaseVIP', { email: localStorage.getItem('email'), vipLevel });
            
            hideLoading();
            
            if (result.success) {
                await fetchUser();
                await fetchWithdrawalStatus();
                alert(`✅ ${result.message}`);
                renderDashboard();
            } else {
                alert(result.error || "Purchase failed.");
            }
            
            isLoading = false;
        }
        
        async function withdraw() {
            if (!withdrawalStatus || !withdrawalStatus.canWithdraw) {
                alert("Withdrawal not available yet. Please wait.");
                return;
            }
            
            if (!confirm(`Withdraw ${withdrawalStatus.totalReturn} USDT?\n\nInvestment: ${withdrawalStatus.investedAmount} USDT\nProfit: +${withdrawalStatus.profit} USDT (${withdrawalStatus.profitPercent}%)\n\nProceed?`)) {
                return;
            }
            
            isLoading = true;
            showLoading("Processing withdrawal...");
            
            const result = await callSheet('withdraw', { email: localStorage.getItem('email') });
            
            hideLoading();
            
            if (result.success) {
                await fetchUser();
                await fetchWithdrawalStatus();
                alert(`✅ ${result.message}`);
                renderDashboard();
            } else {
                alert(result.error || "Withdrawal failed.");
            }
            
            isLoading = false;
        }
        
        function copyWalletAddress() {
            navigator.clipboard.writeText(MAIN_WALLET);
            alert("Wallet address copied!");
        }
        
        function logout() {
            if (countdownInterval) clearInterval(countdownInterval);
            localStorage.clear();
            render();
        }
        
        function isLoggedIn() {
            return !!localStorage.getItem('token');
        }
        
        function showLoading(message) {
            let overlay = document.getElementById('loading-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loading-overlay';
                overlay.className = 'loading-overlay';
                document.body.appendChild(overlay);
            }
            overlay.innerHTML = `<div style="background: #1e1b4b; padding: 20px 40px; border-radius: 16px;">⏳ ${message}</div>`;
            overlay.style.display = 'flex';
        }
        
        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function startCountdown(lockEndDate) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateCountdown() {
                const countdownEl = document.getElementById('countdown');
                if (!countdownEl) return;
                
                const now = new Date();
                const end = new Date(lockEndDate);
                const remaining = Math.max(0, end - now);
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    renderDashboard();
                    return;
                }
                
                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                
                if (days > 0) {
                    countdownEl.innerHTML = `⏰ Withdrawal available in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
                } else {
                    countdownEl.innerHTML = `⏰ Withdrawal available in: ${hours}h ${minutes}m ${seconds}s`;
                }
            }
            
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
        
        // ========== RENDER AUTH FORM ==========
        function renderAuthForm() {
            let activeTab = 'login';
            let email = '';
            let password = '';
            let retypePassword = '';
            let error = '';
            let loading = false;
            
            function handleSubmit() {
                if (loading) return;
                loading = true;
                error = '';
                render();
                
                if (activeTab === 'login') {
                    login(email, password).then(result => {
                        loading = false;
                        if (result.success) {
                            render();
                        } else {
                            error = result.error;
                            render();
                        }
                    });
                } else {
                    register(email, password, retypePassword).then(result => {
                        loading = false;
                        if (result.success) {
                            render();
                        } else {
                            error = result.error;
                            render();
                        }
                    });
                }
            }
            
            function render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    <div class="form-container">
                        <div class="form-card">
                            <h1>☀️ SolarInvest SA</h1>
                            <div class="subtitle">Invest in Solar • 125% Profit</div>
                            
                            <div class="tab-buttons">
                                <button class="tab-btn ${activeTab === 'login' ? 'active' : ''}" onclick="window.authHandler.setTab('login')">Login</button>
                                <button class="tab-btn ${activeTab === 'register' ? 'active' : ''}" onclick="window.authHandler.setTab('register')">Register</button>
                            </div>
                            
                            <input type="email" placeholder="Email Address" id="email" value="${escapeHtml(email)}">
                            <input type="password" placeholder="Password" id="password" value="${escapeHtml(password)}">
                            ${activeTab === 'register' ? `<input type="password" placeholder="Retype Password" id="retypePassword">` : ''}
                            
                            ${error ? `<div class="error-text">❌ ${error}</div>` : ''}
                            
                            <button ${loading ? 'disabled' : ''} onclick="window.authHandler.submit()">
                                ${loading ? 'Processing...' : (activeTab === 'login' ? 'Login' : 'Register')}
                            </button>
                            
                            <div class="info-box" style="margin-top: 20px;">
                                💡 Invest in solar energy • Earn 125% profit • Withdraw after 3 days
                            </div>
                        </div>
                    </div>
                `;
                
                const emailInput = document.getElementById('email');
                const passwordInput = document.getElementById('password');
                const retypeInput = document.getElementById('retypePassword');
                if (emailInput) emailInput.addEventListener('input', (e) => email = e.target.value);
                if (passwordInput) passwordInput.addEventListener('input', (e) => password = e.target.value);
                if (retypeInput) retypeInput.addEventListener('input', (e) => retypePassword = e.target.value);
            }
            
            window.authHandler = {
                setTab: (tab) => {
                    activeTab = tab;
                    error = '';
                    render();
                },
                submit: handleSubmit
            };
            
            render();
        }
        
        // ========== RENDER DASHBOARD ==========
        async function renderDashboard() {
            await fetchUser();
            await fetchWithdrawalStatus();
            
            const vipConfigResult = await callSheet('getVIPConfig', {});
            const VIP_CONFIG = vipConfigResult.error ? {} : vipConfigResult;
            
            const app = document.getElementById('app');
            
            let vipCardsHtml = '';
            const vipList = ['VIP1', 'VIP2', 'VIP3', 'VIP4', 'VIP5', 'GOLD'];
            
            for (const vip of vipList) {
                const config = VIP_CONFIG[vip];
                if (!config) continue;
                
                const isGold = vip === 'GOLD';
                vipCardsHtml += `
                    <div class="vip-card ${isGold ? 'gold' : ''}" onclick="window.dashboardHandler.buyVIP('${vip}')">
                        <div class="vip-header ${isGold ? 'gold' : ''}">
                            <div class="vip-name">${vip}</div>
                            ${isGold ? '<div class="gold-badge">🌟 LIMITED OFFER</div>' : ''}
                        </div>
                        <div class="vip-body">
                            <div class="vip-price">${config.cost} USDT</div>
                            <div class="vip-return">📈 +${config.profitPercent}% Profit</div>
                            <div class="vip-profit">💰 Total Return: ${config.totalReturn} USDT</div>
                            <div class="vip-delay">
                                ⏰ Withdrawal available after ${config.lockDays} days<br>
                                <span style="font-size: 11px;">For your security</span>
                            </div>
                            <button class="buy-btn">Buy ${vip}</button>
                        </div>
                    </div>
                `;
            }
            
            let activeInvestmentHtml = '';
            if (withdrawalStatus && withdrawalStatus.hasInvestment) {
                const canWithdraw = withdrawalStatus.canWithdraw;
                
                activeInvestmentHtml = `
                    <div class="investment-card">
                        <h3 style="margin-bottom: 15px;">📊 Your Active Investment</h3>
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                            <div><strong>VIP Level:</strong> ${withdrawalStatus.vipLevel}</div>
                            <div><strong>Invested:</strong> ${withdrawalStatus.investedAmount} USDT</div>
                            <div><strong>Expected Return:</strong> ${withdrawalStatus.totalReturn} USDT</div>
                            <div><strong>Profit:</strong> +${withdrawalStatus.profit} USDT (${withdrawalStatus.profitPercent}%)</div>
                        </div>
                        
                        ${!canWithdraw ? `
                            <div class="countdown" id="countdown"></div>
                            <div style="text-align: center; color: #94a3b8; font-size: 14px;">
                                🔒 For your security, withdrawal available after ${withdrawalStatus.lockDays} days
                            </div>
                        ` : `
                            <div style="text-align: center; color: #4ade80; margin: 15px 0;">
                                ✅ Withdrawal is now available!
                            </div>
                            <button class="withdraw-btn" onclick="window.dashboardHandler.withdraw()">
                                💰 Withdraw ${withdrawalStatus.totalReturn} USDT
                            </button>
                        `}
                    </div>
                `;
                
                if (!canWithdraw && withdrawalStatus.startDate) {
                    const lockEnd = new Date(withdrawalStatus.startDate);
                    lockEnd.setDate(lockEnd.getDate() + withdrawalStatus.lockDays);
                    setTimeout(() => startCountdown(lockEnd), 100);
                }
            }
            
            app.innerHTML = `
                <div class="container">
                    <div class="header">
                        <div class="logo">☀️ SolarInvest SA</div>
                        <div class="flex-buttons">
                            <button class="deposit-btn" onclick="window.dashboardHandler.deposit()">
                                💰 Deposit
                            </button>
                            <button class="logout-btn" onclick="window.dashboardHandler.logout()">Logout</button>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="label">💰 Balance</div>
                            <div class="value green">${userBalance.toFixed(2)} USDT</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">📈 Total Invested</div>
                            <div class="value">${userInvested.toFixed(2)} USDT</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">✨ Total Earned</div>
                            <div class="value yellow">${userEarned.toFixed(2)} USDT</div>
                        </div>
                        <div class="stat-card">
                            <div class="label">📊 Active Investment</div>
                            <div class="value blue">${withdrawalStatus && withdrawalStatus.hasInvestment ? 'Yes' : 'No'}</div>
                        </div>
                    </div>
                    
                    <div class="wallet-box">
                        <div style="font-size: 14px; margin-bottom: 8px;">💳 Deposit USDT (TRC20) to:</div>
                        <div class="wallet-address">${MAIN_WALLET}</div>
                        <button onclick="window.dashboardHandler.copyAddress()" style="background: #334155; padding: 8px 16px; font-size: 12px; width: auto; margin-top: 10px;">📋 Copy Address</button>
                        <div class="info-box" style="margin-top: 15px;">
                            After sending USDT, click DEPOSIT and enter your Transaction ID (TX Hash).
                        </div>
                    </div>
                    
                    ${activeInvestmentHtml}
                    
                    <h2>🌱 Investment Plans (125% Profit)</h2>
                    <div class="vip-grid">
                        ${vipCardsHtml}
                    </div>
                    
                    <div class="info-box">
                        <strong>📌 How it works:</strong><br>
                        1️⃣ Copy wallet address and send USDT (TRC20)<br>
                        2️⃣ Click DEPOSIT and enter your Transaction ID<br>
                        3️⃣ Buy any VIP plan<br>
                        4️⃣ Wait 3 days for security<br>
                        5️⃣ Withdraw your investment + 125% profit
                    </div>
                </div>
            `;
            
            window.dashboardHandler = {
                buyVIP: (vip) => purchaseVIP(vip, VIP_CONFIG[vip]),
                withdraw: () => withdraw(),
                logout: () => logout(),
                deposit: () => depositWithTX(),
                copyAddress: () => copyWalletAddress()
            };
        }
        
        async function render() {
            if (isLoggedIn()) {
                await renderDashboard();
            } else {
                renderAuthForm();
            }
        }
        
        render();
    </script>
</body>
</html>
