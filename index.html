<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SolarInvest SA - Invest in Solar Energy</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        
        /* Smooth animations */
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Form Container */
        .form-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }
        
        .form-card {
            background: white;
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        
        .form-card h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            color: #0284c7;
        }
        
        .form-card .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .tab-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 16px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: #0284c7;
            color: white;
            box-shadow: 0 2px 8px rgba(2,132,199,0.3);
        }
        
        .password-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        
        .password-wrapper input {
            width: 100%;
            padding: 14px 48px 14px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        .password-wrapper input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2,132,199,0.1);
        }
        
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: color 0.2s;
        }
        
        .password-toggle:hover {
            color: #0284c7;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        input:focus {
            outline: none;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(2,132,199,0.1);
        }
        
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2,132,199,0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        /* Header */
        .header {
            background: white;
            padding: 16px 24px;
            border-radius: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #0284c7;
        }
        
        .logo i {
            margin-right: 10px;
            color: #fbbf24;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .value.green { color: #10b981; }
        .value.blue { color: #0284c7; }
        
        /* Two columns layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }
        
        /* Activity Feed */
        .activity-feed {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        
        .activity-feed h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .activity-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .activity-icon {
            width: 36px;
            height: 36px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-email {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }
        
        .activity-amount {
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
        }
        
        .activity-time {
            font-size: 11px;
            color: #94a3b8;
        }
        
        /* Panel Cards */
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        
        .panel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        
        .panel-card:active {
            transform: translateY(0);
        }
        
        .panel-card.gold {
            border: 2px solid #fbbf24;
            background: linear-gradient(135deg, white, #fffbeb);
        }
        
        .panel-card.gold::before {
            content: "🌟 BEST VALUE";
            position: absolute;
            top: 12px;
            right: -30px;
            background: #fbbf24;
            color: #1e1b4b;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 30px;
            transform: rotate(45deg);
        }
        
        .panel-price {
            font-size: 36px;
            font-weight: 700;
            color: #0284c7;
        }
        
        .panel-daily {
            color: #10b981;
            font-weight: 600;
            margin: 12px 0;
            font-size: 16px;
        }
        
        .panel-total {
            color: #64748b;
            font-size: 14px;
        }
        
        .btn-outline {
            width: 100%;
            padding: 12px;
            background: #f0f9ff;
            border: 1px solid #0284c7;
            border-radius: 14px;
            font-weight: 600;
            color: #0284c7;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }
        
        .btn-outline:hover {
            background: #0284c7;
            color: white;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        /* Wallet Box */
        .wallet-box {
            background: white;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .wallet-address {
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #e2e8f0;
        }
        
        /* Investment Card */
        .investment-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #10b981;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .claim-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
        }
        
        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.3);
        }
        
        /* Info Box */
        .info-box {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #bae6fd;
        }
        
        /* Project Description */
        .project-description {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 30px;
            border-radius: 28px;
            margin: 30px 0 20px;
            text-align: center;
        }
        
        .project-description h3 {
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .project-description p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .project-description .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .project-description .stat-item {
            text-align: center;
        }
        
        .project-description .stat-number {
            font-size: 28px;
            font-weight: 700;
        }
        
        .project-description .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 1000;
            animation: slideUp 0.3s ease;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .flex-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .form-card { padding: 24px; margin: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .panel-grid { grid-template-columns: 1fr; }
            .project-description { padding: 20px; }
            .project-description .stats { gap: 20px; }
            .toast { white-space: normal; text-align: center; max-width: 90%; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyh0B1oBOwPNIZoxB1fxAsfdob4Ovtnmqo_bID86gSs4pJy2pMnxdw-C0byxyv0XijTQ/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";
        const PANEL_PRICE = 90;
        
        // Cache user data
        let userEmail = null;
        let userBalance = 0;
        let userPanels = 0;
        let userDailyProfit = 0;
        let userTotalInvested = 0;
        let activeInvestment = null;
        let isLoading = false;
        
        // Activity Feed (static for demo, updates every 10s)
        const demoEmails = [
            "sarah.j**@gmail.com", "mike.w**@yahoo.com", "emma.b**@outlook.com",
            "david.m**@gmail.com", "lisa.k**@yahoo.com", "alex.r**@gmail.com",
            "anna.s**@outlook.com", "kevin.t**@gmail.com", "julia.l**@yahoo.com"
        ];
        let activityList = [];
        let activityInterval = null;
        
        function initActivityFeed() {
            const amounts = [4, 8, 12, 16, 20, 24, 28, 32, 36, 40];
            for (let i = 0; i < 8; i++) {
                activityList.unshift({
                    email: demoEmails[Math.floor(Math.random() * demoEmails.length)],
                    amount: amounts[Math.floor(Math.random() * amounts.length)],
                    time: new Date().toLocaleTimeString()
                });
            }
            activityInterval = setInterval(() => {
                activityList.pop();
                activityList.unshift({
                    email: demoEmails[Math.floor(Math.random() * demoEmails.length)],
                    amount: amounts[Math.floor(Math.random() * amounts.length)],
                    time: new Date().toLocaleTimeString()
                });
                updateActivityFeed();
            }, 15000);
        }
        
        function updateActivityFeed() {
            const el = document.getElementById('activity-list');
            if (!el) return;
            el.innerHTML = activityList.map(item => `
                <li class="activity-item">
                    <div class="activity-icon"><i class="fas fa-solar-panel"></i></div>
                    <div class="activity-content">
                        <div class="activity-email">${item.email}</div>
                        <div class="activity-amount">+${item.amount} USDT profit claimed</div>
                        <div class="activity-time">${item.time}</div>
                    </div>
                    <i class="fas fa-check-circle" style="color: #10b981; font-size: 14px;"></i>
                </li>
            `).join('');
        }
        
        function showToast(message, type = "info") {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...data })
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function register(email, password, retype) {
            if (password !== retype) { showToast("Passwords do not match", "error"); return false; }
            if (password.length < 6) { showToast("Password must be at least 6 characters", "error"); return false; }
            
            const result = await callAPI('register', { email, password });
            
            if (result.success) {
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userPassword', password);
                showToast("Registration successful! Welcome to SolarInvest SA 🌞", "success");
                return true;
            } else {
                showToast(result.error || "Registration failed", "error");
                return false;
            }
        }
        
        async function login(email, password) {
            const result = await callAPI('login', { email, password });
            
            if (result.success) {
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userPassword', password);
                userBalance = result.balance;
                userPanels = result.panels;
                userDailyProfit = result.dailyProfit;
                userTotalInvested = result.totalInvested;
                showToast(`Welcome back, ${email.split('@')[0]}! 🌞`, "success");
                return true;
            } else {
                showToast(result.error || "Login failed", "error");
                return false;
            }
        }
        
        async function loadUserData() {
            const email = localStorage.getItem('userEmail');
            if (!email) return false;
            
            const result = await callAPI('getUser', { email });
            if (result && result.email) {
                userBalance = result.balance || 0;
                userPanels = result.panels || 0;
                userDailyProfit = result.dailyProfit || 0;
                userTotalInvested = result.totalInvested || 0;
                return true;
            }
            return false;
        }
        
        async function loadActiveInvestment() {
            const email = localStorage.getItem('userEmail');
            if (!email) return;
            
            const result = await callAPI('getActiveInvestment', { email });
            activeInvestment = result;
        }
        
        async function buyPanels(panels) {
            if (isLoading) return;
            const cost = panels * PANEL_PRICE;
            
            if (userBalance < cost) {
                showToast(`Insufficient balance. Need ${cost} USDT`, "error");
                return;
            }
            
            if (!confirm(`🌞 Invest in ${panels} solar panel(s) for ${cost} USDT?\n\n📈 Daily profit: ${panels * 4} USDT\n💰 Total in 30 days: ${panels * 120} USDT\n⏰ First withdrawal after 3 days.\n\nProceed?`)) {
                return;
            }
            
            isLoading = true;
            showToast("Processing your investment...", "info");
            
            const result = await callAPI('buyPanels', {
                email: localStorage.getItem('userEmail'),
                panels: panels
            });
            
            isLoading = false;
            
            if (result.success) {
                userBalance = result.newBalance;
                userPanels = result.newPanels;
                userDailyProfit = result.newDailyProfit;
                showToast(`✅ Invested in ${panels} panel(s)! Daily profit: ${result.newDailyProfit} USDT`, "success");
                renderDashboard();
            } else {
                showToast(result.error || "Investment failed", "error");
            }
        }
        
        async function claimProfit() {
            if (isLoading) return;
            isLoading = true;
            showToast("Claiming your profit...", "info");
            
            const result = await callAPI('claimProfit', {
                email: localStorage.getItem('userEmail')
            });
            
            isLoading = false;
            
            if (result.success) {
                userBalance = result.newBalance;
                showToast(`🎉 Claimed ${result.claimed} USDT!`, "success");
                renderDashboard();
            } else {
                showToast(result.error || "Claim failed", "error");
            }
        }
        
        function copyWalletAddress() {
            navigator.clipboard.writeText(MAIN_WALLET);
            showToast("Wallet address copied! 📋", "success");
        }
        
        function showDepositInfo() {
            alert(
                "📋 DEPOSIT USDT\n\n" +
                "1️⃣ Send USDT (TRC20) to:\n" + MAIN_WALLET + "\n\n" +
                "2️⃣ Send the Transaction ID (TX Hash) to the admin\n\n" +
                "3️⃣ Admin will add balance to your account\n\n" +
                "📧 Contact admin: [your contact info]"
            );
        }
        
        function logout() {
            if (activityInterval) clearInterval(activityInterval);
            localStorage.clear();
            render();
            showToast("Logged out successfully", "success");
        }
        
        function isLoggedIn() { return !!localStorage.getItem('userEmail'); }
        
        function renderAuthForm() {
            let activeTab = 'login';
            let email = '', password = '', retype = '';
            
            const app = document.getElementById('app');
            
            function render() {
                app.innerHTML = `
                    <div class="form-container">
                        <div class="form-card fade-in">
                            <h1><i class="fas fa-solar-panel"></i> SolarInvest SA</h1>
                            <div class="subtitle">Invest in Solar Energy • Earn Daily Profits</div>
                            <div class="tab-buttons">
                                <button class="tab-btn ${activeTab === 'login' ? 'active' : ''}" onclick="window.switchTab('login')">Login</button>
                                <button class="tab-btn ${activeTab === 'register' ? 'active' : ''}" onclick="window.switchTab('register')">Register</button>
                            </div>
                            ${activeTab === 'login' ? `
                                <input type="email" id="email" placeholder="Email Address" value="${email}">
                                <div class="password-wrapper">
                                    <input type="password" id="password" placeholder="Password" value="${password}">
                                    <span class="password-toggle" onclick="togglePassword('password')"><i class="fas fa-eye"></i></span>
                                </div>
                                <button class="btn-primary" onclick="window.submitLogin()">Login</button>
                            ` : `
                                <input type="email" id="email" placeholder="Email Address" value="${email}">
                                <div class="password-wrapper">
                                    <input type="password" id="password" placeholder="Password" value="${password}">
                                    <span class="password-toggle" onclick="togglePassword('password')"><i class="fas fa-eye"></i></span>
                                </div>
                                <div class="password-wrapper">
                                    <input type="password" id="retype" placeholder="Retype Password" value="${retype}">
                                    <span class="password-toggle" onclick="togglePassword('retype')"><i class="fas fa-eye"></i></span>
                                </div>
                                <button class="btn-primary" onclick="window.submitRegister()">Create Account</button>
                            `}
                            <div class="info-box">
                                <i class="fas fa-solar-panel"></i> 1 Solar Panel (550W) = 90 USDT<br>
                                📈 Daily profit: 4 USDT • 💰 Total in 30 days: 120 USDT
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('email')?.addEventListener('input', (e) => email = e.target.value);
                document.getElementById('password')?.addEventListener('input', (e) => password = e.target.value);
                if (activeTab === 'register') {
                    document.getElementById('retype')?.addEventListener('input', (e) => retype = e.target.value);
                }
            }
            
            window.switchTab = (tab) => {
                activeTab = tab;
                render();
            };
            
            window.submitLogin = async () => {
                if (await login(email, password)) render();
            };
            
            window.submitRegister = async () => {
                if (await register(email, password, retype)) render();
            };
            
            window.togglePassword = (id) => {
                const input = document.getElementById(id);
                const icon = input.nextElementSibling.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            };
            
            render();
        }
        
        async function renderDashboard() {
            await loadUserData();
            await loadActiveInvestment();
            
            if (!activityInterval) {
                initActivityFeed();
            }
            updateActivityFeed();
            
            const app = document.getElementById('app');
            
            const panelOptions = [1, 2, 3, 4, 5, 10];
            let panelsHtml = '';
            
            for (const panels of panelOptions) {
                const cost = panels * PANEL_PRICE;
                const daily = panels * 4;
                const total = panels * 120;
                const isGold = panels === 10;
                
                panelsHtml += `
                    <div class="panel-card ${isGold ? 'gold' : ''}" onclick="window.buyPanels(${panels})">
                        <div class="panel-price">${cost} USDT</div>
                        <div class="panel-daily"><i class="fas fa-sun"></i> ${daily} USDT / day</div>
                        <div class="panel-total"><i class="fas fa-calendar"></i> Total in 30 days: ${total} USDT</div>
                        <button class="btn-outline">Invest Now</button>
                    </div>
                `;
            }
            
            let investmentHtml = '';
            if (activeInvestment && activeInvestment.hasInvestment) {
                const canClaim = activeInvestment.canClaim;
                const remainingDays = activeInvestment.remainingDays;
                const dailyProfit = activeInvestment.dailyProfit;
                const panels = activeInvestment.panels;
                
                investmentHtml = `
                    <div class="investment-card fade-in">
                        <h3><i class="fas fa-solar-panel"></i> Your Solar Investment</h3>
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0;">
                            <div><strong>Active Panels:</strong> ${panels} x 550W</div>
                            <div><strong>Daily Profit:</strong> ${dailyProfit} USDT</div>
                            <div><strong>Total Expected:</strong> ${panels * 120} USDT</div>
                        </div>
                        ${!canClaim ? `
                            <div style="text-align: center; padding: 15px; background: #fef3c7; border-radius: 16px;">
                                <i class="fas fa-clock"></i> 🔒 First withdrawal available in: <strong>${remainingDays} day(s)</strong>
                                <div style="font-size: 12px; margin-top: 5px;">For your security, withdrawals are locked for 3 days</div>
                            </div>
                        ` : `
                            <button class="claim-btn" onclick="window.claimProfit()">
                                <i class="fas fa-money-bill-wave"></i> Claim Daily Profit (${dailyProfit} USDT)
                            </button>
                        `}
                    </div>
                `;
            }
            
            app.innerHTML = `
                <div class="container fade-in">
                    <div class="header">
                        <div class="logo"><i class="fas fa-solar-panel"></i> SolarInvest SA</div>
                        <div class="flex-buttons">
                            <button class="btn-secondary" onclick="window.showDepositInfo()"><i class="fas fa-plus-circle"></i> Deposit</button>
                            <button class="btn-secondary" onclick="window.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-wallet"></i> Your Balance</div>
                            <div class="value green">${userBalance.toFixed(2)} USDT</div>
                        </div>
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-solar-panel"></i> Active Panels</div>
                            <div class="value blue">${userPanels}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-chart-line"></i> Total Invested</div>
                            <div class="value">${userTotalInvested.toFixed(2)} USDT</div>
                        </div>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div>
                            <div class="wallet-box">
                                <div><i class="fas fa-qrcode"></i> DEPOSIT USDT (TRC20) TO:</div>
                                <div class="wallet-address">${MAIN_WALLET}</div>
                                <button class="btn-outline" onclick="window.copyWalletAddress()" style="width: auto; padding: 8px 24px;"><i class="fas fa-copy"></i> Copy Address</button>
                                <div class="info-box" style="margin-top: 16px;">
                                    <i class="fas fa-info-circle"></i> After sending USDT, contact admin with your Transaction ID (TX Hash) to add balance.
                                </div>
                            </div>
                            
                            ${investmentHtml}
                            
                            <h2 style="margin: 30px 0 20px 0;"><i class="fas fa-solar-panel"></i> Solar Panel Packages</h2>
                            <div class="panel-grid">${panelsHtml}</div>
                        </div>
                        
                        <div class="activity-feed">
                            <h3><i class="fas fa-bell"></i> Live Activity</h3>
                            <ul class="activity-list" id="activity-list"></ul>
                        </div>
                    </div>
                    
                    <!-- Project Description Paragraph -->
                    <div class="project-description">
                        <h3><i class="fas fa-solar-panel"></i> Why Invest in SolarInvest SA?</h3>
                        <p>
                            South Africa faces an energy crisis with daily load shedding affecting businesses and families. 
                            Solar energy is the sustainable solution. By investing in our solar panel project, you're not just 
                            earning passive income — you're helping power South African homes and businesses with clean, 
                            renewable energy. Each 550W solar panel produces enough energy to power a small home, 
                            reducing carbon emissions by 500kg per year.
                        </p>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-number">500+</div>
                                <div class="stat-label">Solar Panels Installed</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">250+</div>
                                <div class="stat-label">Happy Investors</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">150+</div>
                                <div class="stat-label">Homes Powered</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">50+</div>
                                <div class="stat-label">Tons CO₂ Saved</div>
                            </div>
                        </div>
                        <p style="margin-top: 20px; font-size: 14px;">
                            🌍 <strong>Join the green energy revolution today!</strong> Earn 33% profit in 30 days while making a positive impact on the environment.
                        </p>
                    </div>
                    
                    <div class="info-box">
                        <strong><i class="fas fa-list-check"></i> How it works:</strong><br><br>
                        1️⃣ Copy wallet address and send USDT (TRC20)<br>
                        2️⃣ Contact admin with your Transaction ID (TX Hash)<br>
                        3️⃣ Admin adds balance to your account<br>
                        4️⃣ Buy solar panels (1 panel = 90 USDT, 4 USDT/day profit)<br>
                        5️⃣ First withdrawal after 3 days, then daily withdrawals for 30 days!<br>
                        <br>
                        <i class="fas fa-shield-alt"></i> <strong>Your investment is secured by real solar assets in South Africa.</strong>
                    </div>
                </div>
            `;
            
            updateActivityFeed();
        }
        
        window.buyPanels = buyPanels;
        window.claimProfit = claimProfit;
        window.showDepositInfo = showDepositInfo;
        window.copyWalletAddress = copyWalletAddress;
        window.logout = logout;
        
        async function render() {
            if (isLoggedIn()) {
                await renderDashboard();
            } else {
                renderAuthForm();
            }
        }
        
        render();
    </script>
</body>
</html>
