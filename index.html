<body>
    <div id="app"></div>
    
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYEZmAvrtmf988DcFe1c7M0U3kcz3U4DPUnK1TjRtU8kgd4dBtPn-5w_iPMMx3ENRnzg/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";
        
        // VIP Packages - Solar Panel Model
        // 1 solar panel (550W) = 90 USDT, daily profit = 4 USDT, total in 30 days = 120 USDT
        const VIP_PACKAGES = {
            VIP1: { name: "VIP1", panels: 1, price: 90, dailyProfit: 4, totalProfit: 120, duration: 30 },
            VIP2: { name: "VIP2", panels: 2, price: 180, dailyProfit: 8, totalProfit: 240, duration: 30 },
            VIP3: { name: "VIP3", panels: 3, price: 270, dailyProfit: 12, totalProfit: 360, duration: 30 },
            VIP4: { name: "VIP4", panels: 4, price: 360, dailyProfit: 16, totalProfit: 480, duration: 30 },
            VIP5: { name: "VIP5", panels: 5, price: 450, dailyProfit: 20, totalProfit: 600, duration: 30 },
            GOLD: { name: "GOLD", panels: 10, price: 900, dailyProfit: 40, totalProfit: 1200, duration: 30, isGold: true }
        };
        
        // Activity Feed Data
        const namePrefixes = ['john', 'sarah', 'mike', 'emma', 'david', 'lisa', 'alex', 'anna', 'kevin', 'julia', 'thomas', 'sophia', 'daniel', 'olivia', 'james', 'chloe', 'robert', 'isabella', 'william', 'mia'];
        const nameSuffixes = ['smith', 'johnson', 'williams', 'brown', 'jones', 'garcia', 'miller', 'davis', 'rodriguez', 'martinez', 'anderson', 'taylor', 'thomas', 'moore', 'jackson', 'martin', 'lee', 'white', 'harris', 'clark'];
        
        function generateRandomEmail() {
            const prefix = namePrefixes[Math.floor(Math.random() * namePrefixes.length)];
            const suffix = nameSuffixes[Math.floor(Math.random() * nameSuffixes.length)];
            const num = Math.floor(Math.random() * 1000);
            const domains = ['gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com'];
            const domain = domains[Math.floor(Math.random() * domains.length)];
            return `${prefix}.${suffix}${num}@${domain}`;
        }
        
        function maskEmail(email) {
            const [local, domain] = email.split('@');
            if (local.length <= 3) return email;
            const masked = local.substring(0, 3) + '****' + local.substring(local.length - 1);
            return `${masked}@${domain}`;
        }
        
        function generateRandomAmount() {
            const amounts = [4, 8, 12, 16, 20, 40, 3, 7, 11, 15, 19, 38];
            return amounts[Math.floor(Math.random() * amounts.length)];
        }
        
        let activityInterval = null;
        let activityList = [];
        
        function initActivityFeed() {
            for (let i = 0; i < 10; i++) {
                const email = generateRandomEmail();
                const amount = generateRandomAmount();
                activityList.unshift({
                    email: maskEmail(email),
                    amount: amount,
                    time: new Date().toLocaleTimeString()
                });
            }
            activityInterval = setInterval(() => {
                activityList.pop();
                const newEmail = generateRandomEmail();
                const newAmount = generateRandomAmount();
                activityList.unshift({
                    email: maskEmail(newEmail),
                    amount: newAmount,
                    time: new Date().toLocaleTimeString()
                });
                updateActivityFeedDisplay();
            }, 10000);
        }
        
        function updateActivityFeedDisplay() {
            const activityListElement = document.getElementById('activity-list');
            if (!activityListElement) return;
            activityListElement.innerHTML = activityList.map(item => `
                <li class="activity-item">
                    <div class="activity-icon"><i class="fas fa-solar-panel"></i></div>
                    <div class="activity-content">
                        <div class="activity-email">${item.email}</div>
                        <div class="activity-amount">+${item.amount} USDT solar profit claimed</div>
                        <div class="activity-time">${item.time}</div>
                    </div>
                    <i class="fas fa-check-circle" style="color: #10b981;"></i>
                </li>
            `).join('');
        }
        
        function stopActivityFeed() {
            if (activityInterval) { clearInterval(activityInterval); activityInterval = null; }
        }
        
        let userData = null;
        let userBalance = 0;
        let userTotalSpent = 0;
        let activeInvestment = null;
        let isLoading = false;
        let countdownInterval = null;
        
        function showToast(message, type = "info", title = "") {
            const container = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                div.className = 'toast-container';
                document.body.appendChild(div);
                return div;
            })();
            const titles = { success: "Success", error: "Error", info: "Information" };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle')}"></i>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
        
        async function callSheet(action, data = {}) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...data })
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                console.error("API Error:", error);
                return { error: error.message };
            }
        }
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function register(email, password, retypePassword) {
            if (password !== retypePassword) { showToast("Passwords do not match", "error"); return { success: false }; }
            if (password.length < 6) { showToast("Password must be at least 6 characters", "error"); return { success: false }; }
            const checkUser = await callSheet('getUser', { email });
            if (checkUser && checkUser.email) { showToast("Email already registered", "error"); return { success: false }; }
            const hashedPassword = await hashPassword(password);
            const result = await callSheet('register', { email, password: hashedPassword });
            if (result.success) {
                localStorage.setItem('token', btoa(email));
                localStorage.setItem('email', email);
                showToast("Welcome to SolarInvest SA!", "success", "Registration Complete");
                return { success: true };
            }
            showToast(result.error || "Registration failed", "error");
            return { success: false };
        }
        
        async function login(email, password) {
            const hashedPassword = await hashPassword(password);
            const result = await callSheet('getUser', { email });
            if (result.error || !result.email) { showToast("No account found", "error"); return { success: false }; }
            if (result.password_hash !== hashedPassword) { showToast("Incorrect password", "error"); return { success: false }; }
            localStorage.setItem('token', btoa(email));
            localStorage.setItem('email', email);
            showToast(`Welcome back!`, "success", "Login Successful");
            return { success: true };
        }
        
        async function fetchUser() {
            const email = localStorage.getItem('email');
            if (!email) return false;
            const result = await callSheet('getUser', { email });
            if (result.email) {
                userData = result;
                userBalance = result.balance || 0;
                userTotalSpent = result.totalSpent || 0;
                return true;
            }
            return false;
        }
        
        async function fetchActiveInvestment() {
            const email = localStorage.getItem('email');
            if (!email) return null;
            const result = await callSheet('getActiveInvestment', { email });
            activeInvestment = result;
            return activeInvestment;
        }

                            <button class="modal-close" onclick="closeModal('deposit-modal')">&times;</button>
                        </div>

                                <div style="margin-bottom: 8px;"><i class="fas fa-qrcode"></i> Send USDT (TRC20) to:</div>

                            </div>

        async function submitDeposit() {
            const txHash = document.getElementById('modal-txhash')?.value.trim();
            const amount = document.getElementById('modal-amount')?.value;
            if (!txHash || txHash.length < 20) { showToast("Invalid Transaction ID", "error"); return; }
            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) { showToast("Invalid amount", "error"); return; }
            closeModal('deposit-modal');
            isLoading = true;
            showLoading("Verifying transaction...");
            const result = await callSheet('verifyTransaction', { 
                email: localStorage.getItem('email'), txHash: txHash, amount: parseFloat(amount)
            });
            hideLoading();
            if (result.success) {
                await fetchUser();
                showToast(`${result.amount} USDT added to your balance!`, "success", "Deposit Verified");
                renderDashboard();
            } else {
                showToast(result.error || "Verification failed", "error");
            }
            isLoading = false;
        }

        async function confirmPurchase(vipKey, price) {
            closeModal('purchase-modal');
            if (userBalance < price) { showToast(`Insufficient balance. Need ${price} USDT.`, "error"); return; }
            isLoading = true;
            showLoading("Processing your solar investment...");
            const result = await callSheet('investSolar', { 
                email: localStorage.getItem('email'), 
                vipLevel: vipKey, 
                amount: price,
                panels: VIP_PACKAGES[vipKey].panels,
                dailyProfit: VIP_PACKAGES[vipKey].dailyProfit,
                totalProfit: VIP_PACKAGES[vipKey].totalProfit
            });
            hideLoading();
            if (result.success) {
                await fetchUser();
                await fetchActiveInvestment();
                showToast(`✅ You invested in ${VIP_PACKAGES[vipKey].panels} solar panel(s)! First withdrawal available after 3 days.`, "success", "Investment Active");
                renderDashboard();
            } else {
                showToast(result.error || "Investment failed", "error");
            }
            isLoading = false;
        }
        
        async function claimDailyProfit() {
            if (!activeInvestment || !activeInvestment.hasInvestment) {
                showToast("No active investment found.", "error");
                return;
            }
            
            if (!activeInvestment.canClaim) {
                const remaining = activeInvestment.remainingDays;
                showToast(`First withdrawal available in ${remaining} day(s). Please wait.`, "error");
                return;
            }
            
            isLoading = true;
            showLoading("Claiming your solar profit...");
            const result = await callSheet('claimDailyProfit', { email: localStorage.getItem('email') });
            hideLoading();
            
            if (result.success) {
                await fetchUser();
                await fetchActiveInvestment();
                showToast(`✅ Claimed ${result.claimed} USDT from your solar panels!`, "success", "Profit Claimed");
                renderDashboard();
            } else {
                showToast(result.error || "Claim failed", "error");
            }
            isLoading = false;
        }
        
        function copyWalletAddress() {
            navigator.clipboard.writeText(MAIN_WALLET);
            showToast("Wallet address copied!", "success", "Copied!");
        }
        
        function logout() {
            stopActivityFeed();
            if (countdownInterval) clearInterval(countdownInterval);
            localStorage.clear();
            render();
            showToast("Logged out successfully", "info", "Logged Out");
        }
        
        function isLoggedIn() { return !!localStorage.getItem('token'); }
        
        function showLoading(message) {
            let overlay = document.getElementById('loading-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loading-overlay';
                overlay.className = 'loading-overlay';
                document.body.appendChild(overlay);
            }
            overlay.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner fa-pulse"></i><div>${message}</div></div>`;
            overlay.style.display = 'flex';
        }
        
        function hideLoading() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.remove();
        }
        
        function setupPasswordToggles() {
            document.querySelectorAll('.password-toggle').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('input');
                    const icon = this.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                    }
                });
            });
        }
