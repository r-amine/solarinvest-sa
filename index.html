<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SolarInvest SA - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        
        * {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        .header:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #0284c7;
            cursor: pointer;
        }
        
        .logo:hover {
            transform: scale(1.02);
        }
        
        .logo i {
            margin-right: 10px;
            color: #fbbf24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .value.green { color: #10b981; }

        .announcement-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20000;
            animation: fadeInModal 0.3s ease;

        .announcement-modal {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;

            padding: 24px;
            border-radius: 32px 32px 0 0;

            text-align: center;
        }
        
        .announcement-header h2 {
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .announcement-header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 8px;
        }
        
        .announcement-body {
            padding: 24px;
        }
        
        .vip-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        
        .vip-table th {
            background: #f1f5f9;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            color: #0284c7;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .vip-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .vip-table tr:hover {
            background: #f8fafc;
        }
        
        .commission-box {
            background: linear-gradient(135deg, #fef3c7, #fffbeb);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
            border: 1px solid #fbbf24;
        }
        
        .commission-box h4 {
            color: #d97706;
            margin-bottom: 10px;
        }
        
        .commission-box .percentage {
            font-size: 28px;
            font-weight: 700;
            color: #f59e0b;
        }
        
        .recruit-text {
            background: #dbeafe;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        
        .recruit-text i {
            color: #0284c7;
            margin-right: 8px;
        }
        
        .announcement-footer {
            padding: 20px 24px 24px;
            text-align: center;
            border-top: 1px solid #e2e8f0;
        }
        
        .btn-know {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-know:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(2,132,199,0.3);
        }
        
        /* Regular Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            animation: fadeInModal 0.2s ease;
        }
        
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

        @keyframes modalSlideIn {

            to {

        .modal-header {
            padding: 24px 24px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 { font-size: 24px; color: #0284c7; display: flex; align-items: center; gap: 10px; }

            cursor: pointer;

        .modal-info-value { font-weight: 700; color: #0284c7; }
        
        .input-group { margin-bottom: 16px; }

        .input-group input {

        }
        .input-group input:focus {

            box-shadow: 0 0 0 3px rgba(2,132,199,0.1);
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel:hover { background: #e2e8f0; transform: scale(1.02); }
        
        .btn-confirm {

        .error-text { color: #ef4444; font-size: 12px; margin-top: 5px; }
        
        .toast-container {

        .toast.info { border-left-color: #0284c7; }
        
        .toast i { font-size: 20px; }

        .toast.error i { color: #ef4444; }
        .toast.info i { color: #0284c7; }
        
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .toast-message { font-size: 13px; color: #64748b; }

            color: #94a3b8;
        }
        .toast-close:hover { color: #ef4444; transform: scale(1.1); }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }

            .container { padding: 16px; }

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyh0B1oBOwPNIZoxB1fxAsfdob4Ovtnmqo_bID86gSs4pJy2pMnxdw-C0byxyv0XijTQ/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";

        const DAILY_PROFIT_PER_PANEL = 4;
        const TOTAL_PROFIT_30_DAYS = 120;
        const ROI_PERCENT = 33.33;
        
        // Announcement data - VIP packages (without VIP0)
        const VIP_ANNOUNCEMENT = [

        let userDailyProfit = 0;
        let userTotalInvested = 0;
        let activeInvestment = null;
        let isLoading = false;
        let countdownInterval = null;
        let profitChart = null;
        let announcementShown = false;
        
        const investorNames = ["SolarWhale", "GreenGiant", "SunKing", "EcoRich", "PowerInvestor", "FutureFund", "CleanCapital", "SolarTycoon", "EnergyElite", "GreenWealth", "SunHunter", "EcoProsper", "SolarDream", "PowerProfit", "GreenGains"];
        
        function generateRealisticLeaderboard() {
            const leaderboard = [];
            for (let i = 0; i < 10; i++) {
                const panels = Math.floor(Math.random() * 100) + 1;
                const profit = panels * TOTAL_PROFIT_30_DAYS + Math.floor(Math.random() * 500);

        }

            app.innerHTML = `<div class="container fade-in"><div class="header"><div class="logo" onclick="window.showProfileModal()"><i class="fas fa-solar-panel"></i> SolarInvest SA</div><div class="flex-buttons"><button class="btn-secondary" onclick="window.showDepositModal()"><i class="fas fa-plus-circle"></i> Deposit</button><button class="btn-secondary" onclick="window.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="stats-grid"><div class="stat-card"><div class="label"><i class="fas fa-wallet"></i> Your Balance</div><div class="value green">${userBalance.toFixed(2)} USDT</div></div><div class="stat-card"><div class="label"><i class="fas fa-solar-panel"></i> Active Panels</div><div class="value blue">${userPanels}</div></div><div class="stat-card"><div class="label"><i class="fas fa-chart-line"></i> Total Invested</div><div class="value">${userTotalInvested.toFixed(2)} USDT</div></div></div><div class="dashboard-grid"><div><div class="profile-section"><div class="profile-header"><div><h3><i class="fas fa-user-circle"></i> My Account</h3><div class="profile-email"><i class="fas fa-envelope"></i> ${userEmail}</div></div><button class="edit-profile-btn" onclick="window.showProfileModal()"><i class="fas fa-edit"></i> View Profile</button></div></div><div class="chart-container"><h3><i class="fas fa-chart-line"></i> Profit Forecast (7 days)</h3><canvas id="profitChart"></canvas></div><div class="wallet-box"><div><i class="fas fa-qrcode"></i> DEPOSIT USDT (TRC20) TO:</div><div class="wallet-address">${MAIN_WALLET}</div><button class="btn-outline" onclick="window.copyWalletAddress()" style="width: auto; padding: 8px 24px;"><i class="fas fa-copy"></i> Copy Address</button><div class="info-box" style="margin-top: 16px;"><i class="fas fa-info-circle"></i> After sending USDT, click DEPOSIT and send TX Hash to admin.</div></div>${investmentHtml}<h2 style="margin: 30px 0 20px 0;"><i class="fas fa-solar-panel"></i> Solar Panel Packages</h2><div class="panel-grid">${panelsHtml}</div></div><div><div class="leaderboard"><h3><i class="fas fa-trophy"></i> Top Investors</h3><ul class="leaderboard-list" id="leaderboard-list"></ul></div><div class="activity-feed"><h3><i class="fas fa-bell"></i> Live Activity</h3><ul class="activity-list" id="activity-list"></ul></div></div></div><div class="info-box" style="margin-top: 20px;"><strong><i class="fas fa-list-check"></i> How it works:</strong><br><br>1. Copy wallet address and send USDT (TRC20)<br>2. Click DEPOSIT and send TX Hash to admin<br>3. Admin adds balance to your account<br>4. Buy solar panels (1 panel = 90 USDT, 4 USDT/day profit, 33.33% ROI)</div></div>`;
            
            updateActivityFeedDisplay();
            updateLeaderboardDisplay();
            initProfitChart();
            if (activeInvestment && activeInvestment.hasInvestment && !activeInvestment.canClaim && activeInvestment.startDate) {
                const lockEnd = new Date(activeInvestment.startDate);
                lockEnd.setDate(lockEnd.getDate() + 3);
                startCountdownTimer(lockEnd);
            }
            
            // Show announcement modal after dashboard loads
            setTimeout(() => showAnnouncement(), 500);
        }
        
        window.showInvestmentModal = showInvestmentModal;
        window.showDepositModal = showDepositModal;
        window.showProfileModal = showProfileModal;
        window.claimProfit = claimProfit;
        window.copyWalletAddress = copyWalletAddress;
        window.logout = logout;
        window.closeAnnouncement = closeAnnouncement;
        
        if (!localStorage.getItem('userEmail')) { window.location.href = "login.html"; }
        else { renderDashboard(); }
    </script>
</body>
</html>
