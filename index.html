<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SolarInvest SA - Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            color: #0f172a;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: white;
            padding: 16px 24px;
            border-radius: 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #0284c7;
        }
        
        .logo i {
            margin-right: 10px;
            color: #fbbf24;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }
        
        .value.green { color: #10b981; }
        .value.blue { color: #0284c7; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
        }
        
        .activity-feed {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: fit-content;
        }
        
        .activity-feed h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .activity-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .activity-item {
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .activity-icon {
            width: 36px;
            height: 36px;
            background: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0284c7;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-email {
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
        }
        
        .activity-amount {
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
        }
        
        .activity-time {
            font-size: 11px;
            color: #94a3b8;
        }
        
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .panel-card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }
        
        .panel-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        
        .panel-card.gold {
            border: 2px solid #fbbf24;
            background: linear-gradient(135deg, white, #fffbeb);
        }
        
        .panel-card.gold::before {
            content: "BEST VALUE";
            position: absolute;
            top: 12px;
            right: -30px;
            background: #fbbf24;
            color: #1e1b4b;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 30px;
            transform: rotate(45deg);
        }
        
        .panel-price {
            font-size: 36px;
            font-weight: 700;
            color: #0284c7;
        }
        
        .panel-daily {
            color: #10b981;
            font-weight: 600;
            margin: 12px 0;
            font-size: 16px;
        }
        
        .panel-total {
            color: #64748b;
            font-size: 14px;
        }
        
        .btn-outline {
            width: 100%;
            padding: 12px;
            background: #f0f9ff;
            border: 1px solid #0284c7;
            border-radius: 14px;
            font-weight: 600;
            color: #0284c7;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }
        
        .btn-outline:hover {
            background: #0284c7;
            color: white;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            padding: 10px 20px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .wallet-box {
            background: white;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .wallet-address {
            background: #f8fafc;
            padding: 12px;
            border-radius: 16px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin: 16px 0;
            border: 1px solid #e2e8f0;
        }
        
        .investment-card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #10b981;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .claim-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .claim-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16,185,129,0.3);
        }
        
        .info-box {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
            font-size: 14px;
            text-align: center;
            border: 1px solid #bae6fd;
        }
        
        .project-description {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 30px;
            border-radius: 28px;
            margin: 30px 0 20px;
            text-align: center;
        }
        
        .project-description h3 {
            font-size: 22px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .project-description p {
            font-size: 15px;
            line-height: 1.6;
            opacity: 0.95;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .project-description .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        
        .project-description .stat-item {
            text-align: center;
        }
        
        .project-description .stat-number {
            font-size: 28px;
            font-weight: 700;
        }
        
        .project-description .stat-label {
            font-size: 12px;
            opacity: 0.8;
        }
        
        /* Countdown Timer */
        .countdown-timer {
            background: #fef3c7;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
        }
        
        .countdown-timer .timer {
            font-size: 28px;
            font-weight: 700;
            color: #d97706;
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .countdown-timer .label {
            font-size: 13px;
            color: #92400e;
            margin-top: 5px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10001;
            animation: fadeInModal 0.2s ease;
        }
        
        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal {
            background: white;
            border-radius: 32px;
            width: 90%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            padding: 24px 24px 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 {
            font-size: 24px;
            color: #0284c7;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            width: auto;
            padding: 0;
            transition: color 0.2s;
        }
        
        .modal-close:hover {
            color: #ef4444;
        }
        
        .modal-body {
            padding: 24px;
        }
        
        .modal-footer {
            padding: 0 24px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .modal-info {
            background: #f0f9ff;
            padding: 16px;
            border-radius: 16px;
            margin: 16px 0;
            text-align: center;
        }
        
        .modal-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .modal-info-row:last-child {
            border-bottom: none;
        }
        
        .modal-info-label {
            font-weight: 600;
            color: #64748b;
        }
        
        .modal-info-value {
            font-weight: 700;
            color: #0284c7;
        }
        
        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-cancel:hover {
            background: #e2e8f0;
        }
        
        .btn-confirm {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2,132,199,0.3);
        }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .toast {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 320px;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid;
        }
        
        .toast.success { border-left-color: #10b981; }
        .toast.error { border-left-color: #ef4444; }
        .toast.info { border-left-color: #0284c7; }
        
        .toast i { font-size: 20px; }
        .toast.success i { color: #10b981; }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: #0284c7; }
        
        .toast-content { flex: 1; }
        .toast-title { font-weight: 600; color: #0f172a; margin-bottom: 4px; }
        .toast-message { font-size: 13px; color: #64748b; }
        .toast-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #94a3b8;
            padding: 0;
            width: auto;
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .flex-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .panel-grid { grid-template-columns: 1fr; }
            .project-description { padding: 20px; }
            .project-description .stats { gap: 20px; }
            .toast { min-width: 280px; right: 16px; left: 16px; }
            .modal { width: 95%; margin: 16px; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyyh0B1oBOwPNIZoxB1fxAsfdob4Ovtnmqo_bID86gSs4pJy2pMnxdw-C0byxyv0XijTQ/exec";
        const MAIN_WALLET = "TLi3ANb8GCJzypyBofqwvjqjXR1G8Hr1cN";
        const PANEL_PRICE = 90;
        
        let userEmail = null;
        let userBalance = 0;
        let userPanels = 0;
        let userDailyProfit = 0;
        let userTotalInvested = 0;
        let activeInvestment = null;
        let isLoading = false;
        let countdownInterval = null;
        
        const demoEmails = [
            "sarah.j**@gmail.com", "mike.w**@yahoo.com", "emma.b**@outlook.com",
            "david.m**@gmail.com", "lisa.k**@yahoo.com", "alex.r**@gmail.com",
            "anna.s**@outlook.com", "kevin.t**@gmail.com", "julia.l**@yahoo.com"
        ];
        let activityList = [];
        let activityInterval = null;
        
        function showToast(message, type = "info", title = "") {
            const container = document.getElementById('toast-container') || (() => {
                const div = document.createElement('div');
                div.id = 'toast-container';
                div.className = 'toast-container';
                document.body.appendChild(div);
                return div;
            })();
            
            const titles = { success: "Success", error: "Error", info: "Information" };
            const icons = { success: "fa-check-circle", error: "fa-exclamation-circle", info: "fa-info-circle" };
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type]}"></i>
                <div class="toast-content">
                    <div class="toast-title">${title || titles[type]}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
            `;
            
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentElement) toast.remove();
            }, 4000);
        }
        
        function showModal(title, content, onConfirm = null, confirmText = "Confirm") {
            const modalHTML = `
                <div class="modal-overlay" id="custom-modal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3><i class="fas fa-solar-panel"></i> ${title}</h3>
                            <button class="modal-close" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            ${content}
                        </div>
                        <div class="modal-footer">
                            ${onConfirm ? `<button class="btn-confirm" id="modal-confirm-btn">${confirmText}</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', modalHTML);
            
            if (onConfirm) {
                const confirmBtn = document.getElementById('modal-confirm-btn');
                if (confirmBtn) confirmBtn.addEventListener('click', () => { closeModal(); onConfirm(); });
            }
        }
        
        function closeModal() {
            const modal = document.getElementById('custom-modal');
            if (modal) modal.remove();
        }
        
        function showDepositModal() {
            const content = `
                <div class="modal-info">
                    <div style="font-size: 14px; margin-bottom: 12px;"><i class="fas fa-qrcode"></i> Send USDT (TRC20) to:</div>
                    <div style="background: #f8fafc; padding: 12px; border-radius: 12px; font-family: monospace; font-size: 12px; word-break: break-all; border: 1px solid #e2e8f0;">
                        ${MAIN_WALLET}
                    </div>
                    <button onclick="copyWalletAddressAndClose()" style="margin-top: 12px; background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 12px; cursor: pointer; width: 100%;">
                        <i class="fas fa-copy"></i> Copy Address
                    </button>
                </div>
                <div style="margin-top: 16px; padding: 12px; background: #fef3c7; border-radius: 12px; font-size: 13px;">
                    <i class="fas fa-info-circle"></i> After sending USDT, contact admin with your Transaction ID (TX Hash).
                </div>
            `;
            showModal("Deposit USDT", content, null, "");
        }
        
        function copyWalletAddressAndClose() {
            navigator.clipboard.writeText(MAIN_WALLET);
            closeModal();
            showToast("Wallet address copied!", "success");
        }
        
        function showInvestmentModal(panels) {
            const cost = panels * PANEL_PRICE;
            const dailyProfit = panels * 4;
            const totalProfit = panels * 120;
            
            const content = `
                <div class="modal-info">
                    <div class="modal-info-row">
                        <span class="modal-info-label"><i class="fas fa-tag"></i> Investment Amount</span>
                        <span class="modal-info-value">${cost} USDT</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label"><i class="fas fa-sun"></i> Daily Profit</span>
                        <span class="modal-info-value">${dailyProfit} USDT</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label"><i class="fas fa-calendar"></i> Total in 30 Days</span>
                        <span class="modal-info-value">${totalProfit} USDT</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label"><i class="fas fa-chart-line"></i> Your Profit</span>
                        <span class="modal-info-value" style="color: #10b981;">+${totalProfit - cost} USDT</span>
                    </div>
                </div>
                <div style="margin-top: 16px; padding: 12px; background: #dbeafe; border-radius: 12px; font-size: 13px;">
                    <i class="fas fa-shield-alt"></i> Your investment is secured by real solar assets.
                </div>
            `;
            
            showModal(`Invest in ${panels} Solar Panel${panels > 1 ? 's' : ''}`, content, () => {
                confirmInvestment(panels);
            }, "Confirm Investment");
        }
        
        async function confirmInvestment(panels) {
            await buyPanels(panels);
        }
        
        function initActivityFeed() {
            const amounts = [4, 8, 12, 16, 20, 24, 28, 32, 36, 40];
            for (let i = 0; i < 8; i++) {
                activityList.unshift({
                    email: demoEmails[Math.floor(Math.random() * demoEmails.length)],
                    amount: amounts[Math.floor(Math.random() * amounts.length)],
                    time: new Date().toLocaleTimeString()
                });
            }
            activityInterval = setInterval(() => {
                activityList.pop();
                activityList.unshift({
                    email: demoEmails[Math.floor(Math.random() * demoEmails.length)],
                    amount: amounts[Math.floor(Math.random() * amounts.length)],
                    time: new Date().toLocaleTimeString()
                });
                updateActivityFeed();
            }, 15000);
        }
        
        function updateActivityFeed() {
            const el = document.getElementById('activity-list');
            if (!el) return;
            el.innerHTML = activityList.map(item => `
                <li class="activity-item">
                    <div class="activity-icon"><i class="fas fa-solar-panel"></i></div>
                    <div class="activity-content">
                        <div class="activity-email">${item.email}</div>
                        <div class="activity-amount">+${item.amount} USDT profit claimed</div>
                        <div class="activity-time">${item.time}</div>
                    </div>
                    <i class="fas fa-check-circle" style="color: #10b981; font-size: 14px;"></i>
                </li>
            `).join('');
        }
        
        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...data })
                });
                const text = await response.text();
                return JSON.parse(text);
            } catch (error) {
                return { success: false, error: error.message };
            }
        }
        
        async function loadUserData() {
            const email = localStorage.getItem('userEmail');
            if (!email) return false;
            
            userEmail = email;
            userBalance = parseFloat(localStorage.getItem('userBalance') || 0);
            userPanels = parseInt(localStorage.getItem('userPanels') || 0);
            userDailyProfit = parseFloat(localStorage.getItem('userDailyProfit') || 0);
            userTotalInvested = parseFloat(localStorage.getItem('userTotalInvested') || 0);
            
            const result = await callAPI('getUser', { email });
            if (result && result.email) {
                userBalance = result.balance || 0;
                userPanels = result.panels || 0;
                userDailyProfit = result.dailyProfit || 0;
                userTotalInvested = result.totalInvested || 0;
                localStorage.setItem('userBalance', userBalance);
                localStorage.setItem('userPanels', userPanels);
                localStorage.setItem('userDailyProfit', userDailyProfit);
                localStorage.setItem('userTotalInvested', userTotalInvested);
            }
            return true;
        }
        
        async function loadActiveInvestment() {
            const email = localStorage.getItem('userEmail');
            if (!email) return;
            
            const result = await callAPI('getActiveInvestment', { email });
            activeInvestment = result;
        }
        
        function startCountdownTimer(withdrawalDate) {
            if (countdownInterval) clearInterval(countdownInterval);
            
            function updateTimer() {
                const timerEl = document.getElementById('countdown-timer');
                if (!timerEl) return;
                
                const now = new Date();
                const end = new Date(withdrawalDate);
                const remaining = Math.max(0, end - now);
                
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    timerEl.innerHTML = '<span class="timer" style="color: #10b981;">Available Now!</span><div class="label">You can now withdraw your profit</div>';
                    renderDashboard();
                    return;
                }
                
                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((remaining % (1000 * 60)) / 1000);
                
                if (days > 0) {
                    timerEl.innerHTML = `<span class="timer">${days}d ${hours}h ${minutes}m ${seconds}s</span><div class="label">Time remaining until withdrawal available</div>`;
                } else {
                    timerEl.innerHTML = `<span class="timer">${hours}h ${minutes}m ${seconds}s</span><div class="label">Time remaining until withdrawal available</div>`;
                }
            }
            
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }
        
        async function buyPanels(panels) {
            if (isLoading) return;
            const cost = panels * PANEL_PRICE;
            
            if (userBalance < cost) {
                showToast(`Insufficient balance. Need ${cost} USDT`, "error");
                return;
            }
            
            isLoading = true;
            showToast("Processing your investment...", "info");
            
            const result = await callAPI('buyPanels', {
                email: localStorage.getItem('userEmail'),
                panels: panels
            });
            
            isLoading = false;
            
            if (result.success) {
                userBalance = result.newBalance;
                userPanels = result.newPanels;
                userDailyProfit = result.newDailyProfit;
                localStorage.setItem('userBalance', userBalance);
                localStorage.setItem('userPanels', userPanels);
                localStorage.setItem('userDailyProfit', userDailyProfit);
                showToast(`Invested in ${panels} panel(s)! Daily profit: ${result.newDailyProfit} USDT`, "success");
                await loadActiveInvestment();
                renderDashboard();
            } else {
                showToast(result.error || "Investment failed", "error");
            }
        }
        
        async function claimProfit() {
            if (isLoading) return;
            isLoading = true;
            showToast("Claiming your profit...", "info");
            
            const result = await callAPI('claimProfit', {
                email: localStorage.getItem('userEmail')
            });
            
            isLoading = false;
            
            if (result.success) {
                userBalance = result.newBalance;
                localStorage.setItem('userBalance', userBalance);
                showToast(`Claimed ${result.claimed} USDT!`, "success");
                await loadActiveInvestment();
                renderDashboard();
            } else {
                showToast(result.error || "Claim failed", "error");
            }
        }
        
        function copyWalletAddress() {
            navigator.clipboard.writeText(MAIN_WALLET);
            showToast("Wallet address copied!", "success");
        }
        
        function logout() {
            if (activityInterval) clearInterval(activityInterval);
            if (countdownInterval) clearInterval(countdownInterval);
            localStorage.clear();
            window.location.href = "login.html";
        }
        
        async function renderDashboard() {
            await loadUserData();
            await loadActiveInvestment();
            
            if (!activityInterval) initActivityFeed();
            updateActivityFeed();
            
            const app = document.getElementById('app');
            
            const panelOptions = [1, 2, 3, 4, 5, 10];
            let panelsHtml = '';
            
            for (const panels of panelOptions) {
                const cost = panels * PANEL_PRICE;
                const daily = panels * 4;
                const total = panels * 120;
                const isGold = panels === 10;
                
                panelsHtml += `
                    <div class="panel-card ${isGold ? 'gold' : ''}" onclick="window.showInvestmentModal(${panels})">
                        <div class="panel-price">${cost} USDT</div>
                        <div class="panel-daily"><i class="fas fa-sun"></i> ${daily} USDT / day</div>
                        <div class="panel-total"><i class="fas fa-calendar"></i> Total in 30 days: ${total} USDT</div>
                        <button class="btn-outline">Invest Now</button>
                    </div>
                `;
            }
            
            let investmentHtml = '';
            if (activeInvestment && activeInvestment.hasInvestment) {
                const canClaim = activeInvestment.canClaim;
                const dailyProfit = activeInvestment.dailyProfit;
                const panels = activeInvestment.panels;
                const startDate = activeInvestment.startDate;
                
                if (startDate && !canClaim) {
                    const lockEnd = new Date(startDate);
                    lockEnd.setDate(lockEnd.getDate() + 3);
                    setTimeout(() => startCountdownTimer(lockEnd), 100);
                } else if (canClaim && countdownInterval) {
                    clearInterval(countdownInterval);
                }
                
                investmentHtml = `
                    <div class="investment-card fade-in">
                        <h3><i class="fas fa-solar-panel"></i> Your Solar Investment</h3>
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin: 15px 0;">
                            <div><strong>Active Panels:</strong> ${panels} x 550W</div>
                            <div><strong>Daily Profit:</strong> ${dailyProfit} USDT</div>
                            <div><strong>Total Expected:</strong> ${panels * 120} USDT</div>
                        </div>
                        ${!canClaim ? `
                            <div class="countdown-timer" id="countdown-timer">
                                <div class="timer">Loading...</div>
                                <div class="label">Time remaining until withdrawal available</div>
                            </div>
                        ` : `
                            <button class="claim-btn" onclick="window.claimProfit()">
                                <i class="fas fa-money-bill-wave"></i> Claim Daily Profit (${dailyProfit} USDT)
                            </button>
                        `}
                    </div>
                `;
            }
            
            app.innerHTML = `
                <div class="container fade-in">
                    <div class="header">
                        <div class="logo"><i class="fas fa-solar-panel"></i> SolarInvest SA</div>
                        <div class="flex-buttons">
                            <button class="btn-secondary" onclick="window.showDepositModal()"><i class="fas fa-plus-circle"></i> Deposit</button>
                            <button class="btn-secondary" onclick="window.logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        </div>
                    </div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-wallet"></i> Your Balance</div>
                            <div class="value green">${userBalance.toFixed(2)} USDT</div>
                        </div>
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-solar-panel"></i> Active Panels</div>
                            <div class="value blue">${userPanels}</div>
                        </div>
                        <div class="stat-card">
                            <div class="label"><i class="fas fa-chart-line"></i> Total Invested</div>
                            <div class="value">${userTotalInvested.toFixed(2)} USDT</div>
                        </div>
                    </div>
                    
                    <div class="dashboard-grid">
                        <div>
                            <div class="wallet-box">
                                <div><i class="fas fa-qrcode"></i> DEPOSIT USDT (TRC20) TO:</div>
                                <div class="wallet-address">${MAIN_WALLET}</div>
                                <button class="btn-outline" onclick="window.copyWalletAddress()" style="width: auto; padding: 8px 24px;"><i class="fas fa-copy"></i> Copy Address</button>
                                <div class="info-box" style="margin-top: 16px;">
                                    <i class="fas fa-info-circle"></i> After sending USDT, click DEPOSIT and send TX Hash to admin.
                                </div>
                            </div>
                            
                            ${investmentHtml}
                            
                            <h2 style="margin: 30px 0 20px 0;"><i class="fas fa-solar-panel"></i> Solar Panel Packages</h2>
                            <div class="panel-grid">${panelsHtml}</div>
                        </div>
                        
                        <div class="activity-feed">
                            <h3><i class="fas fa-bell"></i> Live Activity</h3>
                            <ul class="activity-list" id="activity-list"></ul>
                        </div>
                    </div>
                    
                    <div class="project-description">
                        <h3><i class="fas fa-solar-panel"></i> Why Invest in SolarInvest SA?</h3>
                        <p>
                            South Africa faces an energy crisis with daily load shedding affecting businesses and families. 
                            Solar energy is the sustainable solution. By investing in our solar panel project, you're not just 
                            earning passive income — you're helping power South African homes and businesses with clean, 
                            renewable energy.
                        </p>
                        <div class="stats">
                            <div class="stat-item">
                                <div class="stat-number">500+</div>
                                <div class="stat-label">Solar Panels Installed</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">250+</div>
                                <div class="stat-label">Happy Investors</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-number">150+</div>
                                <div class="stat-label">Homes Powered</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="info-box">
                        <strong><i class="fas fa-list-check"></i> How it works:</strong><br><br>
                        1. Copy wallet address and send USDT (TRC20)<br>
                        2. Click DEPOSIT and send TX Hash to admin<br>
                        3. Admin adds balance to your account<br>
                        4. Buy solar panels (1 panel = 90 USDT, 4 USDT/day profit)
                    </div>
                </div>
            `;
            
            updateActivityFeed();
            
            // Restart countdown if needed
            if (activeInvestment && activeInvestment.hasInvestment && !activeInvestment.canClaim && activeInvestment.startDate) {
                const lockEnd = new Date(activeInvestment.startDate);
                lockEnd.setDate(lockEnd.getDate() + 3);
                startCountdownTimer(lockEnd);
            }
        }
        
        window.showInvestmentModal = showInvestmentModal;
        window.showDepositModal = showDepositModal;
        window.claimProfit = claimProfit;
        window.copyWalletAddress = copyWalletAddress;
        window.logout = logout;
        
        if (!localStorage.getItem('userEmail')) {
            window.location.href = "login.html";
        } else {
            renderDashboard();
        }
    </script>
</body>
</html>
